<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Geist,Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <text x="0" y="18" font-size="12" font-weight="700" letter-spacing="1.4" fill="#5E6E87">ONE PUBLISHED REVIEW, AS A MAP OF CLAIMS</text>
  <text x="660" y="18" font-size="12" font-weight="700" letter-spacing="1.4" fill="#5E6E87" text-anchor="middle">CITED PAPERS</text>

  <!-- section bands -->
  <rect x="0" y="34" width="530" height="76" rx="10" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/>
  <rect x="0" y="122" width="530" height="76" rx="10" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/>
  <rect x="0" y="210" width="530" height="76" rx="10" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/>
  <text x="18" y="62" font-size="15" font-weight="700" fill="#0C1018">Introduction</text>
  <text x="18" y="150" font-size="15" font-weight="700" fill="#0C1018">Mechanisms</text>
  <text x="18" y="238" font-size="15" font-weight="700" fill="#0C1018">Therapies</text>
  <text x="18" y="80" font-size="12" fill="#5E6E87">section</text>
  <text x="18" y="168" font-size="12" fill="#5E6E87">section</text>
  <text x="18" y="256" font-size="12" fill="#5E6E87">section</text>

  <!-- citation lines -->
  <g stroke="#CBD2E0" stroke-width="1.4" fill="none">
    <path d="M460 72 L598 58"/>
    <path d="M460 160 L598 128"/>
    <path d="M460 160 L598 198"/>
    <path d="M460 248 L598 268"/>
  </g>
  <text x="540" y="56" font-size="12" fill="#5E6E87" text-anchor="middle">cites</text>

  <!-- papers -->
  <g font-size="13" fill="#0C1018" text-anchor="middle">
    <rect x="600" y="44" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#CBD2E0"/><text x="660" y="63">Paper 1</text>
    <rect x="600" y="114" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#CBD2E0"/><text x="660" y="133">Paper 2</text>
    <rect x="600" y="184" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#CBD2E0"/><text x="660" y="203">Paper 3</text>
    <rect x="600" y="254" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#CBD2E0"/><text x="660" y="273">Paper 4</text>
  </g>
  <text x="660" y="308" font-size="12" fill="#5E6E87" text-anchor="middle">resolved to PubMed IDs</text>

  <!-- relations -->
  <g stroke="#155DFC" stroke-width="2" fill="none">
    <path d="M318 72 H452"/>
    <path d="M310 80 V152"/>
    <path d="M318 160 H452"/>
    <path d="M460 168 V240"/>
    <path d="M318 248 H452"/>
  </g>
  <g font-size="12" font-weight="600" fill="#0A47D6">
    <text x="385" y="64" text-anchor="middle">parallel</text>
    <text x="300" y="120" text-anchor="end">elaboration</text>
    <text x="385" y="152" text-anchor="middle">mechanism</text>
    <text x="470" y="208">condition</text>
    <text x="385" y="270" text-anchor="middle">contrast</text>
  </g>
  <path d="M460 80 V152" stroke="#A10902" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text x="470" y="112" font-size="12" font-weight="600" fill="#A10902">look-alike,</text>
  <text x="470" y="127" font-size="12" font-weight="600" fill="#A10902">unrelated</text>

  <!-- claims -->
  <g fill="#0C1018">
    <circle cx="310" cy="72" r="8"/><circle cx="460" cy="72" r="8"/>
    <circle cx="310" cy="160" r="8"/><circle cx="460" cy="160" r="8"/>
    <circle cx="310" cy="248" r="8"/><circle cx="460" cy="248" r="8"/>
  </g>
  <text x="294" y="76" font-size="12" fill="#5E6E87" text-anchor="end">claim</text>

  <!-- legend -->
  <g font-size="12" fill="#323E52">
    <circle cx="6" cy="314" r="6" fill="#0C1018"/><text x="18" y="318">claim</text>
    <path d="M70 314 H96" stroke="#155DFC" stroke-width="2"/><text x="104" y="318">labeled relationship (5 of 8 types shown)</text>
    <path d="M360 314 H386" stroke="#A10902" stroke-width="2" stroke-dasharray="5 4"/><text x="394" y="318">hard negative</text>
  </g>
