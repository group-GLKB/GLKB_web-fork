<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 300" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
          <g>
            <rect x="40" y="40" width="330" height="212" rx="13" fill="#fff" stroke="#E3E9F0" stroke-width="1.4"/>
            <rect x="40" y="40" width="330" height="5" rx="2.5" fill="#0B8FA8"/>
            <text x="66" y="78" font-size="10.5" font-weight="750" letter-spacing="1.4" fill="#0B8FA8">01 · TEXTUAL</text>
            <text x="66" y="106" font-size="17" font-weight="700" fill="#0A1628">You know the term</text>
            <text x="66" y="136" font-size="13" fill="#6B7C93">Full-text index over vocabulary names</text>
            <text x="66" y="156" font-size="13" fill="#6B7C93">and synonyms. Resolves “p53”,</text>
            <text x="66" y="176" font-size="13" fill="#6B7C93">“TP53” and “tumour protein p53”</text>
            <text x="66" y="196" font-size="13" fill="#6B7C93">to one identifier.</text>
            <rect x="66" y="212" width="278" height="26" rx="6" fill="#F4FAFD"/>
            <text x="80" y="230" font-size="11.5" fill="#0A7186">Precise entry into the controlled vocabulary</text>
          </g>
          <g>
            <rect x="395" y="40" width="330" height="212" rx="13" fill="#fff" stroke="#E3E9F0" stroke-width="1.4"/>
            <rect x="395" y="40" width="330" height="5" rx="2.5" fill="#0E9F6E"/>
            <text x="421" y="78" font-size="10.5" font-weight="750" letter-spacing="1.4" fill="#0E9F6E">02 · SEMANTIC</text>
            <text x="421" y="106" font-size="17" font-weight="700" fill="#0A1628">You know the topic</text>
            <text x="421" y="136" font-size="13" fill="#6B7C93">Vector index over 33.4M abstract</text>
            <text x="421" y="156" font-size="13" fill="#6B7C93">embeddings and 108.5M sentence</text>
            <text x="421" y="176" font-size="13" fill="#6B7C93">embeddings. Finds papers that</text>
            <text x="421" y="196" font-size="13" fill="#6B7C93">never use your wording.</text>
            <rect x="421" y="212" width="278" height="26" rx="6" fill="#F0FAF6"/>
            <text x="435" y="230" font-size="11.5" fill="#0B5B42">Flexible retrieval when the phrasing varies</text>
          </g>
          <g>
            <rect x="750" y="40" width="330" height="212" rx="13" fill="#fff" stroke="#7A5AF8" stroke-width="1.6"/>
            <rect x="750" y="40" width="330" height="5" rx="2.5" fill="#7A5AF8"/>
            <text x="776" y="78" font-size="10.5" font-weight="750" letter-spacing="1.4" fill="#7A5AF8">03 · STRUCTURAL</text>
            <text x="776" y="106" font-size="17" font-weight="700" fill="#0A1628">You know the shape</text>
            <text x="776" y="136" font-size="13" fill="#6B7C93">Cypher over the graph. “Genes</text>
            <text x="776" y="156" font-size="13" fill="#6B7C93">linked to this disease that also</text>
            <text x="776" y="176" font-size="13" fill="#6B7C93">sit in this pathway, ranked by</text>
            <text x="776" y="196" font-size="13" fill="#6B7C93">supporting article count.”</text>
            <rect x="776" y="212" width="278" height="26" rx="6" fill="#F7F4FF"/>
            <text x="790" y="230" font-size="11.5" fill="#5B3FD1">Multi-entity questions no search box can express</text>
          </g>
        </svg>
