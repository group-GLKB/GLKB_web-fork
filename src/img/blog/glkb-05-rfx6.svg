<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
          <defs>
            <marker id="g5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#8494A8"/>
            </marker>
          </defs>

          <!-- step 1 -->
          <text x="40" y="30" font-size="10.5" font-weight="750" letter-spacing="1.5" fill="#9AA9BC">STEP 1 — SCREEN THE KNOCKDOWN DEGs</text>
          <rect x="40" y="46" width="228" height="84" rx="11" fill="#F7F9FC" stroke="#E3E9F0"/>
          <text x="60" y="76" font-size="24" font-weight="750" fill="#0A1628">2,675</text>
          <text x="60" y="98" font-size="12" fill="#6B7C93">DEGs from the</text>
          <text x="60" y="115" font-size="12" fill="#6B7C93"><tspan font-style="italic">RFX6</tspan>-knockdown line</text>

          <path d="M276 88 H 316" stroke="#8494A8" stroke-width="1.8" marker-end="url(#g5a)"/>
          <text x="296" y="78" font-size="10" fill="#8494A8" text-anchor="middle">χ²</text>

          <rect x="324" y="46" width="228" height="84" rx="11" fill="#F4FAFD" stroke="#0B8FA8" stroke-width="1.4"/>
          <text x="344" y="76" font-size="24" font-weight="750" fill="#0A7186">10</text>
          <text x="344" y="98" font-size="12" fill="#6B7C93">genes with significant</text>
          <text x="344" y="115" font-size="12" fill="#6B7C93">literature co-occurrence</text>

          <!-- step 2 -->
          <text x="40" y="176" font-size="10.5" font-weight="750" letter-spacing="1.5" fill="#9AA9BC">STEP 2 — TEST AGAINST T2D KNOCKOUT PANELS</text>
          <rect x="40" y="192" width="228" height="84" rx="11" fill="#F7F9FC" stroke="#E3E9F0"/>
          <text x="60" y="222" font-size="24" font-weight="750" fill="#0A1628">7,018</text>
          <text x="60" y="244" font-size="12" fill="#6B7C93">DEGs across 20 T2D</text>
          <text x="60" y="261" font-size="12" fill="#6B7C93">gene-knockout lines</text>

          <path d="M276 234 H 316" stroke="#8494A8" stroke-width="1.8" marker-end="url(#g5a)"/>
          <text x="296" y="224" font-size="10" fill="#8494A8" text-anchor="middle">χ²</text>

          <rect x="324" y="192" width="228" height="84" rx="11" fill="#F4FAFD" stroke="#0B8FA8" stroke-width="1.4"/>
          <text x="344" y="222" font-size="24" font-weight="750" fill="#0A7186">68</text>
          <text x="344" y="244" font-size="12" fill="#6B7C93">T2D-related genes</text>
          <text x="344" y="261" font-size="12" fill="#6B7C93">(7 overlap with step 1)</text>

          <!-- merge -->
          <path d="M560 88 C 600 88, 600 160, 640 160" fill="none" stroke="#8494A8" stroke-width="1.8"/>
          <path d="M560 234 C 600 234, 600 160, 640 160" fill="none" stroke="#8494A8" stroke-width="1.8" marker-end="url(#g5a)"/>

          <rect x="648" y="120" width="196" height="82" rx="11" fill="#0A1628"/>
          <text x="668" y="152" font-size="26" font-weight="750" fill="#5EE7F5">72</text>
          <text x="668" y="174" font-size="12" fill="#B9CBDD">candidate genes linked</text>
          <text x="668" y="191" font-size="12" fill="#B9CBDD">to both <tspan font-style="italic">RFX6</tspan> and T2D</text>

          <!-- validation -->
          <path d="M852 161 H 892" stroke="#8494A8" stroke-width="1.8" marker-end="url(#g5a)"/>
          <rect x="900" y="112" width="180" height="98" rx="11" fill="#F0FAF6" stroke="#BFE9D8" stroke-width="1.4"/>
          <text x="918" y="140" font-size="10.5" font-weight="750" letter-spacing="1.2" fill="#0B5B42">EXTERNAL CHECK</text>
          <text x="918" y="170" font-size="22" font-weight="750" fill="#0B5B42">19 / 36</text>
          <text x="918" y="190" font-size="11.5" fill="#0E9F6E">known T2D causal genes</text>
          <text x="918" y="204" font-size="11.5" fill="#0E9F6E">recovered, unprompted</text>

          <!-- functional groups -->
          <text x="40" y="316" font-size="10.5" font-weight="750" letter-spacing="1.5" fill="#9AA9BC">STEP 3 — CLUSTER BY LITERATURE CO-OCCURRENCE</text>
          <g>
            <rect x="40" y="332" width="250" height="72" rx="10" fill="#fff" stroke="#E3E9F0"/>
            <text x="58" y="356" font-size="13" font-weight="680" fill="#0A1628">Beta-cell development</text>
            <text x="58" y="376" font-size="11.5" fill="#6B7C93" font-style="italic">PAX6 · ISL1 · MNX1 · PDX1</text>
            <text x="58" y="392" font-size="11.5" fill="#6B7C93" font-style="italic">HNF4A · GLIS3</text>

            <rect x="302" y="332" width="250" height="72" rx="10" fill="#fff" stroke="#E3E9F0"/>
            <text x="320" y="356" font-size="13" font-weight="680" fill="#0A1628">Glucose metabolism</text>
            <text x="320" y="376" font-size="11.5" fill="#6B7C93" font-style="italic">SLC19A2 · SLC16A1</text>

            <rect x="564" y="332" width="250" height="72" rx="10" fill="#fff" stroke="#E3E9F0"/>
            <text x="582" y="356" font-size="13" font-weight="680" fill="#0A1628">Incretin effect</text>
            <text x="582" y="376" font-size="11.5" fill="#6B7C93" font-style="italic">GIP · GIPR · GLP1R</text>

            <rect x="826" y="332" width="254" height="72" rx="10" fill="#fff" stroke="#E3E9F0"/>
            <text x="844" y="356" font-size="13" font-weight="680" fill="#0A1628">Insulin secretion</text>
            <text x="844" y="376" font-size="11.5" fill="#6B7C93" font-style="italic">ABCC8 · KCNJ11 · INS</text>
            <text x="844" y="392" font-size="11.5" fill="#6B7C93">MODY when mutated</text>
          </g>
        </svg>
