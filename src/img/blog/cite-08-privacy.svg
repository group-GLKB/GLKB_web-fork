<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 284" xmlns="http://www.w3.org/2000/svg" font-family="Geist,Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs><marker id="a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8090AB"/></marker></defs>
<text x="0" y="16" font-size="12" font-weight="700" letter-spacing="1.3" fill="#5E6E87">ILLUSTRATION · WHAT LEAVES YOUR MAC, AND WHEN</text><rect x="0" y="34" width="228" height="212" rx="12" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/><text x="16" y="64" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >Stays on your Mac</text><text x="16" y="92" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Everything you select,</text><text x="16" y="110" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >until you ask for citations</text><text x="16" y="128" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" ></text><text x="16" y="146" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Your GLKB key, kept in</text><text x="16" y="164" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >the macOS Keychain</text><text x="16" y="182" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" ></text><text x="16" y="200" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Recent results, in memory</text><text x="16" y="218" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >until you quit the app</text><rect x="246" y="34" width="228" height="212" rx="12" fill="#EEF3FF" stroke="#BBCFFE" stroke-width="1.4"/><text x="262" y="64" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >Goes to GLKB</text><text x="262" y="92" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Only when you click the</text><text x="262" y="110" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >badge or press ⌥⌘G:</text><text x="262" y="128" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" ></text><text x="262" y="146" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >the one sentence you</text><text x="262" y="164" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >selected, how many papers</text><text x="262" y="182" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >you want, and your key</text><rect x="492" y="34" width="228" height="212" rx="12" fill="#EEF3FF" stroke="#BBCFFE" stroke-width="1.4"/><text x="508" y="64" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >Goes to PubMed</text><text x="508" y="92" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Only when you open Cite:</text><text x="508" y="110" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" ></text><text x="508" y="128" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >the ID numbers (PMIDs)</text><text x="508" y="146" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >of the papers, to fetch</text><text x="508" y="164" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >volume, pages and DOI</text><text x="508" y="182" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" ></text><text x="508" y="200" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Never your sentence</text><text x="360" y="272" font-size="13.5" font-weight="600" fill="#0C1018" text-anchor="middle" >No analytics. No history of what you searched.</text>
</svg>
