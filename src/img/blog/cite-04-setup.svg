<text x="0" y="16" font-size="12" font-weight="700" letter-spacing="1.3" fill="#5E6E87">ILLUSTRATION · FIRST LAUNCH: FOUR SHORT STEPS</text><rect x="0" y="34" width="168" height="190" rx="12" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/><rect x="0" y="34" width="168" height="4" rx="2" fill="#155DFC"/><text x="14" y="64" font-size="11.5" font-weight="700" fill="#155DFC" text-anchor="start" letter-spacing="1.2">STEP 1</text><text x="14" y="88" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >Welcome</text><text x="14" y="113" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Read the short</text><text x="14" y="131" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >overview.</text><rect x="14" y="182" width="140" height="28" rx="7" fill="#155DFC" stroke="#155DFC" stroke-width="1.2"/><text x="84.0" y="200.5" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Continue</text><path d="M170 129H182" stroke="#8090AB" stroke-width="1.5" marker-end="url(#a04)"/><rect x="184" y="34" width="168" height="190" rx="12" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/><rect x="184" y="34" width="168" height="4" rx="2" fill="#155DFC"/><text x="198" y="64" font-size="11.5" font-weight="700" fill="#155DFC" text-anchor="start" letter-spacing="1.2">STEP 2</text><text x="198" y="88" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >Allow selected-text</text><text x="198" y="107" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >access</text><text x="198" y="132" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Let the app read the</text><text x="198" y="150" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >text you select.</text><rect x="198" y="182" width="140" height="28" rx="7" fill="#155DFC" stroke="#155DFC" stroke-width="1.2"/><text x="268.0" y="200.5" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Request Access</text><path d="M354 129H366" stroke="#8090AB" stroke-width="1.5" marker-end="url(#a04)"/><rect x="368" y="34" width="168" height="190" rx="12" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/><rect x="368" y="34" width="168" height="4" rx="2" fill="#155DFC"/><text x="382" y="64" font-size="11.5" font-weight="700" fill="#155DFC" text-anchor="start" letter-spacing="1.2">STEP 3</text><text x="382" y="88" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >Store your</text><text x="382" y="107" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >GLKB key</text><text x="382" y="132" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Paste the key that</text><text x="382" y="150" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >starts with glkb_.</text><rect x="382" y="182" width="140" height="28" rx="7" fill="#155DFC" stroke="#155DFC" stroke-width="1.2"/><text x="452.0" y="200.5" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Save</text><path d="M538 129H550" stroke="#8090AB" stroke-width="1.5" marker-end="url(#a04)"/><rect x="552" y="34" width="168" height="190" rx="12" fill="#FFFFFF" stroke="#E5E9F0" stroke-width="1.4"/><rect x="552" y="34" width="168" height="4" rx="2" fill="#155DFC"/><text x="566" y="64" font-size="11.5" font-weight="700" fill="#155DFC" text-anchor="start" letter-spacing="1.2">STEP 4</text><text x="566" y="88" font-size="15" font-weight="700" fill="#0C1018" text-anchor="start" >Your choices</text><text x="566" y="113" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >Keep both switches</text><text x="566" y="131" font-size="12.5" font-weight="400" fill="#5E6E87" text-anchor="start" >on, or change them.</text><rect x="566" y="182" width="140" height="28" rx="7" fill="#155DFC" stroke="#155DFC" stroke-width="1.2"/><text x="636.0" y="200.5" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Finish Setup</text>
</svg>
